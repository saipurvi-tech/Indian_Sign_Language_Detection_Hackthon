<!DOCTYPE html>
<html>
<head><title>Sign Language to Text</title></head>
<body style="font-family:sans-serif;text-align:center">
  <h2>Sign Language to Text</h2>
  <video id="video" width="480" autoplay></video>
  <canvas id="canvas" width="64" height="64" style="display:none"></canvas>
  <h1 id="pred">-</h1>
  <button onclick="addLetter()">Add letter</button>
  <button onclick="document.getElementById('text').innerText=''">Clear</button>
  <h2 id="text"></h2>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let current = "";

navigator.mediaDevices.getUserMedia({ video: true })
  .then(s => video.srcObject = s);

setInterval(async () => {
  if (!video.videoWidth) return;
  ctx.drawImage(video, 0, 0, 64, 64);
  const res = await fetch("/predict", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({image: canvas.toDataURL("image/jpeg")})
  });
  const d = await res.json();
  current = d.label;
  document.getElementById("pred").innerText =
    d.label + " (" + (d.confidence * 100).toFixed(0) + "%)";
}, 700);

function addLetter() {
  document.getElementById("text").innerText += current;
}
</script>
</body>
</html>
